<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARG Bridge & Stock Upload</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-[380px] bg-slate-50 text-slate-800 font-sans p-4 m-0 select-none">
  <!-- Header -->
  <div class="flex items-center justify-between pb-3 border-b border-slate-200">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
        M
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-900 leading-tight">MARG Stock Sync</h1>
        <p class="text-[11px] text-slate-500">Auto XLS / XLSX Reader & Bridge</p>
      </div>
    </div>
    <div id="statusBadge" class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 border border-slate-200">
      <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <!-- MAIN SECTION: XLS / XLSX UPLOAD & DRAG-AND-DROP -->
  <div class="mt-3.5 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Upload & Sync Stock</h2>
      <span class="text-[10px] text-teal-600 font-semibold bg-teal-50 px-1.5 py-0.5 rounded border border-teal-200">Auto-Update</span>
    </div>

    <!-- Drag & Drop Zone -->
    <div id="dropZone" class="mb-dropzone flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-300 hover:border-teal-500 bg-white hover:bg-teal-50/30 rounded-xl transition cursor-pointer text-center group">
      <div class="w-10 h-10 rounded-full bg-teal-50 text-teal-600 flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
      </div>
      <p class="text-xs font-semibold text-slate-700">Drag & Drop MARG Stock File Here</p>
      <p class="text-[10px] text-slate-500 mt-0.5">Supports <b>.XLS</b> (MARG 9+ Dump) and <b>.XLSX</b> (Excel)</p>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="fileInputXls" accept=".xls" class="hidden">
    <input type="file" id="fileInputXlsx" accept=".xlsx" class="hidden">
    <input type="file" id="fileInputAny" accept=".xls,.xlsx,.csv" class="hidden">

    <!-- 2 Buttons: One for XLS, One for XLSX -->
    <div class="grid grid-cols-2 gap-2">
      <button
        type="button"
        id="btnUploadXls"
        class="w-full px-3 py-2.5 text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 border border-emerald-300 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5"
      >
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Upload .XLS File</span>
      </button>

      <button
        type="button"
        id="btnUploadXlsx"
        class="w-full px-3 py-2.5 text-xs font-semibold text-sky-800 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-300 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5"
      >
        <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Upload .XLSX File</span>
      </button>
    </div>

    <!-- Download Sync / Auto-Detect -->
    <div class="p-2.5 bg-slate-100/80 rounded-xl border border-slate-200 text-xs space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-amber-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
          </svg>
          <span class="font-semibold text-slate-800 text-[11px]">Download Auto-Sync:</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="chkAutoSyncDownloads" class="sr-only peer">
          <div class="w-7 h-4 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-teal-600"></div>
        </label>
      </div>

      <button
        type="button"
        id="btnSyncLatestDownload"
        class="w-full px-2.5 py-1.5 text-[11px] font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition shadow-sm flex items-center justify-center gap-1.5"
      >
        <span id="downloadSpinner" class="hidden w-3 h-3 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></span>
        <span>⚡ Sync Latest Downloaded File</span>
      </button>
    </div>

    <!-- Live Status / Progress Banner -->
    <div id="noticeBox" class="hidden p-2.5 rounded-lg text-xs border">
      <div class="flex items-start gap-2">
        <span id="noticeSpinner" class="hidden w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin flex-shrink-0 mt-0.5"></span>
        <p id="noticeText" class="text-xs leading-relaxed flex-1"></p>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE CONNECTION SETTINGS -->
  <div class="mt-3 pt-3 border-t border-slate-200">
    <button
      type="button"
      id="btnToggleSettings"
      class="w-full flex items-center justify-between text-xs font-semibold text-slate-600 hover:text-slate-900 focus:outline-none py-1"
    >
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Server Connection Settings</span>
      </span>
      <svg id="settingsChevron" class="w-3.5 h-3.5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <div id="settingsPanel" class="hidden mt-2.5 space-y-2.5 bg-white p-3 rounded-xl border border-slate-200">
      <div>
        <label for="appUrl" class="block text-[11px] font-semibold text-slate-700 mb-1">
          Next.js App URL
        </label>
        <input
          type="url"
          id="appUrl"
          placeholder="https://shreejiapp.com"
          class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-teal-500 font-mono"
        />
      </div>

      <div>
        <label for="secretKey" class="block text-[11px] font-semibold text-slate-700 mb-1">
          Authorization Secret Key
        </label>
        <div class="relative">
          <input
            type="password"
            id="secretKey"
            placeholder="MARG_SYNC_SECRET"
            class="w-full px-2.5 py-1.5 pr-8 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-teal-500 font-mono"
          />
          <button
            type="button"
            id="togglePassword"
            class="absolute inset-y-0 right-0 px-2 flex items-center text-slate-400 hover:text-slate-600"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button
          type="button"
          id="btnTestConnection"
          class="w-full px-2 py-1.5 text-xs font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition shadow-sm"
        >
          Test Link
        </button>
        <button
          type="button"
          id="btnSaveSettings"
          class="w-full px-2 py-1.5 text-xs font-semibold text-white bg-teal-600 rounded-lg hover:bg-teal-700 transition shadow-sm"
        >
          Save
        </button>
      </div>
    </div>
  </div>

  <script src="../lib/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
